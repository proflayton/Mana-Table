name: Mana Table

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mana-table-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Preserve the existing required context while retiring the Electron client.
  # Java and the MonoGame app have their own source-bound native build gates.
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Check shared CI tool syntax
        run: node scripts/mana-table/check.cjs
      - name: Verify source, artifact and publication guard contracts
        run: node --test scripts/mana-table/tests/*.test.cjs
      - name: Check maintained documentation links
        run: node scripts/mana-table/check-docs.cjs
