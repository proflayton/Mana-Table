name: Test build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      extended:
        description: Run the complete upstream Forge reactor
        type: boolean
        default: true
      api_test_trial:
        description: Compare serial API tests with two isolated JVMs using one compilation
        type: boolean
        default: false
      api_trial_order:
        description: Reverse only after the first pair passes and improves on both JDKs
        type: choice
        options: [serial-first, parallel-first]
        default: serial-first

permissions:
  contents: read

concurrency:
  # A manual timing experiment must never cancel required source verification.
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.api_test_trial && format('java-api-trial-{0}-{1}', github.ref, github.run_id) || format('java-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: ${{ !(github.event_name == 'workflow_dispatch' && inputs.api_test_trial) }}
      matrix:
        java: ['17', '21']
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.api_test_trial && format('API isolation trial (Java {0})', matrix.java) || format('Test with Java {0}', matrix.java) }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'maven'

      - name: Install virtual framebuffer (if not available) to allow running GUI on a headless server
        run: command -v Xvfb >/dev/null 2>&1 || { sudo apt update && sudo apt install -y xvfb; }

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # Native packaging can start while the complete Java matrix runs.
      # Tests are still mandatory below and publication requires both Java jobs.
      - name: Produce the shared source-bound engine
        if: matrix.java == '17' && !(github.event_name == 'workflow_dispatch' && inputs.api_test_trial)
        run: |
          xvfb-run -a mvn -B -ntp -pl forge-api -am package -DskipTests
          node scripts/mana-table/ci-engine-artifact.cjs create

      - name: Share the exact engine build
        if: matrix.java == '17' && !(github.event_name == 'workflow_dispatch' && inputs.api_test_trial)
        uses: actions/upload-artifact@v7
        with:
          name: engine-${{ github.sha }}
          path: |
            forge-api/target/forge-engine.jar
            forge-api/target/forge-engine-fixtures.jar
            forge-api/target/ci-engine-manifest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
          overwrite: true

      - name: Run tests in virtual framebuffer
        id: java_tests
        env:
          EXTENDED: ${{ github.event_name == 'workflow_dispatch' && inputs.extended || false }}
          API_TEST_TRIAL: ${{ github.event_name == 'workflow_dispatch' && inputs.api_test_trial || false }}
          API_TRIAL_ORDER: ${{ inputs.api_trial_order || 'serial-first' }}
          API_TRIAL_ID: github-${{ github.run_id }}-${{ github.run_attempt }}-jdk${{ matrix.java }}
        run: |
          export DISPLAY=":1"
          Xvfb :1 -screen 0 800x600x8 &
          if [ "$API_TEST_TRIAL" = 'true' ]; then
            trial_args=(-Papi-test-trial "-Dmana.tests.trialId=$API_TRIAL_ID" "-Dmana.tests.sourceRevision=$GITHUB_SHA")
            if [ "$API_TRIAL_ORDER" = 'parallel-first' ]; then
              trial_args+=(-Dmana.tests.firstMode=parallel -Dmana.tests.firstForkCount=2 -Dmana.tests.secondMode=serial -Dmana.tests.secondForkCount=1)
            elif [ "$API_TRIAL_ORDER" != 'serial-first' ]; then
              echo 'Unknown API trial order.' >&2
              exit 1
            fi
            mvn -B -ntp -pl forge-api -am clean verify "${trial_args[@]}"
          elif [ "$EXTENDED" = 'true' ]; then
            mvn -B -ntp test -Papi-ci "-Dmana.tests.trialId=$API_TRIAL_ID" "-Dmana.tests.sourceRevision=$GITHUB_SHA"
          else
            mvn -B -ntp -pl forge-api -am verify -Papi-ci "-Dmana.tests.trialId=$API_TRIAL_ID" "-Dmana.tests.sourceRevision=$GITHUB_SHA"
          fi

      - name: Retain complete or incomplete API CI accounting
        if: always() && !(github.event_name == 'workflow_dispatch' && inputs.api_test_trial)
        env:
          API_RUN_ID: github-${{ github.run_id }}-${{ github.run_attempt }}-jdk${{ matrix.java }}
          MAVEN_OUTCOME: ${{ steps.java_tests.outcome }}
        run: |
          node scripts/mana-table/api-test-ci.cjs retain \
            --root "$GITHUB_WORKSPACE/forge-api/target/api-test-runs/$API_RUN_ID" \
            --trial-id "$API_RUN_ID" --source-revision "$GITHUB_SHA" --maven-outcome "$MAVEN_OUTCOME"

      - name: Save compact API CI accounting on every outcome
        if: always() && !(github.event_name == 'workflow_dispatch' && inputs.api_test_trial)
        uses: actions/upload-artifact@v7
        with:
          name: api-ci-java-${{ matrix.java }}-${{ github.run_attempt }}
          path: |
            forge-api/target/api-test-runs/*/manifest.json
            forge-api/target/api-test-runs/*/accounting.json
            forge-api/target/api-test-runs/*/retention.json
            forge-api/target/api-test-runs/*/timings/
            forge-api/target/api-test-runs/*/parallel/fork-*/process-*/process-start.json
            forge-api/target/api-test-runs/*/parallel/fork-*/process-*/invocations.jsonl
            forge-api/target/api-test-runs/*/parallel/fork-*/process-*/receipt.json
            forge-api/target/api-test-runs/*/reports/parallel/fork-*/TEST-*.xml
            forge-api/target/api-test-runs/*/reports/parallel/fork-*/junitreports/TEST-*.xml
          if-no-files-found: error
          retention-days: 14

      - name: Retain API trial accounting, reports and first failure evidence
        if: always() && github.event_name == 'workflow_dispatch' && inputs.api_test_trial
        uses: actions/upload-artifact@v7
        with:
          name: api-test-trial-java-${{ matrix.java }}-${{ github.run_attempt }}
          path: forge-api/target/api-test-trials/
          if-no-files-found: error
          retention-days: 14

      # A reactor failure can stop before later modules. Keep reached reports
      # with their actual outcome; missing reports are incomplete evidence.
      - name: Bind extended reactor reports to this source and JDK
        if: always() && github.event_name == 'workflow_dispatch' && inputs.extended && !inputs.api_test_trial
        env:
          MATRIX_JAVA: ${{ matrix.java }}
          MAVEN_OUTCOME: ${{ steps.java_tests.outcome }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const env = process.env;
          const git = (...args) => execFileSync('git', ['-c', 'core.excludesfile=', ...args], { encoding: 'utf8' }).trim();
          if (env.GITHUB_EVENT_NAME !== 'workflow_dispatch' || !['17', '21'].includes(env.MATRIX_JAVA)
              || !/^[1-9][0-9]*$/.test(env.GITHUB_RUN_ID || '') || !/^[1-9][0-9]*$/.test(env.GITHUB_RUN_ATTEMPT || '')
              || !['success', 'failure', 'cancelled', 'skipped'].includes(env.MAVEN_OUTCOME))
            throw new Error('Invalid extended test run context.');
          if (!/^[0-9a-f]{40}$/.test(env.GITHUB_SHA || '') || git('rev-parse', 'HEAD') !== env.GITHUB_SHA
              || git('status', '--porcelain=v1', '--untracked-files=normal'))
            throw new Error('Extended reports require the exact committed source and a clean checkout.');
          const javaVersion = execFileSync('java', ['--version'], { encoding: 'utf8', maxBuffer: 65536 }).trim();
          if (/^(?:openjdk|java) ([0-9]+)(?:[.\s]|$)/.exec(javaVersion)?.[1] !== env.MATRIX_JAVA)
            throw new Error('Extended reports belong to another JDK.');
          const manifest = { schemaVersion: 1, kind: 'extended-java-test-reports', sourceRevision: env.GITHUB_SHA,
            sourceTree: git('rev-parse', 'HEAD^{tree}'), recordedAtUtc: new Date().toISOString(), repository: env.GITHUB_REPOSITORY,
            workflowRef: env.GITHUB_WORKFLOW_REF, event: env.GITHUB_EVENT_NAME, ref: env.GITHUB_REF,
            runId: env.GITHUB_RUN_ID, runAttempt: env.GITHUB_RUN_ATTEMPT, matrixJava: env.MATRIX_JAVA, javaVersion,
            apiRunId: `github-${env.GITHUB_RUN_ID}-${env.GITHUB_RUN_ATTEMPT}-jdk${env.MATRIX_JAVA}`,
            mavenOutcome: env.MAVEN_OUTCOME };
          fs.mkdirSync('forge-api/target/extended-test-reports', { recursive: true });
          fs.writeFileSync('forge-api/target/extended-test-reports/manifest.json', JSON.stringify(manifest, null, 2) + '\n', { flag: 'wx' });
          NODE

      - name: Save extended reactor test reports on every outcome
        if: always() && github.event_name == 'workflow_dispatch' && inputs.extended && !inputs.api_test_trial
        uses: actions/upload-artifact@v7
        with:
          name: extended-java-${{ matrix.java }}-reports-${{ github.run_attempt }}
          path: |
            forge-api/target/extended-test-reports/manifest.json
            forge-*/target/surefire-reports/**/TEST-*.xml
            forge-*/target/surefire-reports/**/testng-results.xml
            forge-*/target/surefire-reports/**/testng-failed.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Save failed test reports and decision traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: java-${{ matrix.java }}-test-failure-${{ github.run_attempt }}
          path: |
            forge-*/target/surefire-reports/
            forge-api/target/rules-regressions/
            forge-api/target/api-test-runs/
          if-no-files-found: ignore
          retention-days: 14
